[package]
name = "fruitslicer-app"
version = "0.1.0"
description = "FruitSlicer desktop app"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "FruitSlicer"
path = "src/main.rs"

[dependencies]
goo = { path = "../goo" }
slicer = { path = "../slicer", features = ["serde"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "persistence", "wayland", "x11"] }
egui-wgpu = "0.37"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
log = "0.4"
pollster = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
