name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries for the GUI
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all --check
      - run: cargo test --workspace --release
      - name: Check a sliced file with the independent checker
        run: |
          ./target/release/fruitslicer test-pattern pattern.goo
          python3 tools/goo_check.py pattern.goo 0

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p fruitslicer-app -p fruitslicer-cli
      - run: cargo test --release -p fruitslicer-app
      - uses: actions/upload-artifact@v4
        with:
          name: FruitSlicer-windows-x64
          path: |
            target/release/FruitSlicer.exe
            target/release/fruitslicer.exe
